[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aor"
dynamic = ["version"]
description = "Accept or Repair: preserving passage-supported answers in contrastive decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["contrastive-decoding", "knowledge-conflicts", "context-faithfulness", "retrieval-augmented-generation",
            "question-answering", "llm-decoding"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The procedure, the support test and the memory veto need only the standard library; the tables need numpy.
# Decoding with a model needs the run extra, and the browser demo the demo extra.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
run = ["torch>=2.4", "transformers>=4.56", "datasets>=2.19", "accelerate>=0.33"]
demo = ["gradio>=4.44"]
test = ["pytest>=8"]

[project.scripts]
aor = "aor.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/AoR"
Issues = "https://github.com/js-lee-AI/AoR/issues"

[tool.setuptools.dynamic]
version = { attr = "aor.__version__" }

[tool.setuptools.packages.find]
include = ["aor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
